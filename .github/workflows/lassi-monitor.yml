name: Amul Lassi Stock Monitor

on:
  schedule:
    # Runs every 15 minutes. GitHub's scheduler can lag a few minutes at busy times.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated log file back to the repo

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run stock check
        run: python amul_lassi_logger.py

      - name: Commit updated log (if changed)
        run: |
          git config user.name "amul-lassi-bot"
          git config user.email "actions@github.com"
          git add amul_lassi_log.txt
          git diff --staged --quiet || git commit -m "Update stock log $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
